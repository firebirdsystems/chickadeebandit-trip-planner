<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/trip-planner/" />
  <title>Trip Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #000000);
      min-height: 100vh;
    }
    .page { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }

    /* --- Header --- */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; font-weight: 700; }
    h2 { font-size: 1.25rem; font-weight: 700; }
    h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }

    /* --- Buttons --- */
    .btn-primary {
      background: var(--hub-primary, #111827);
      color: var(--hub-primary-fg, #fff);
      border: none;
      border-radius: var(--hub-radius, 8px);
      padding: 9px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--hub-primary-hover, #374151); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      color: var(--hub-text, #000000);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 8px);
      padding: 8px 14px;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .btn-ghost:hover { background: var(--hub-surface, #f3f4f6); }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
    .btn-back { background: none; border: none; color: var(--hub-text-muted, #6b7280); font-size: 0.875rem; cursor: pointer; padding: 4px 0; }
    .btn-back:hover { color: var(--hub-text, #000000); }
    .btn-add {
      background: none;
      border: 1px dashed var(--hub-border, #d1d5db);
      border-radius: 8px;
      color: var(--hub-text-muted, #6b7280);
      width: 100%;
      padding: 8px;
      font-size: 0.83rem;
      cursor: pointer;
      margin-top: 6px;
      text-align: left;
    }
    .btn-add:hover { border-color: var(--hub-primary, #111827); color: var(--hub-text, #000000); }
    .btn-icon { background: none; border: none; cursor: pointer; padding: 4px 6px; font-size: 0.85rem; opacity: 0.45; }
    .btn-icon:hover { opacity: 1; }
    .btn-icon-sm { background: none; border: none; cursor: pointer; padding: 0 4px; color: var(--hub-text-muted, #9ca3af); font-size: 1.1rem; line-height: 1; }
    .btn-icon-sm:hover { color: var(--hub-text, #000000); }
    .btn-danger { background: #dc2626; color: #fff; border: none; border-radius: var(--hub-radius, 8px); padding: 8px 16px; font-size: 0.875rem; cursor: pointer; }
    .btn-danger:hover { background: #b91c1c; }

    /* --- Cards --- */
    .card {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 12px);
      padding: 16px;
      margin-bottom: 12px;
    }

    /* --- Section labels --- */
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--hub-text-muted, #6b7280);
      margin-bottom: 8px;
    }

    /* --- Trip list cards --- */
    .trip-card { cursor: pointer; transition: border-color 0.1s; }
    .trip-card:hover { border-color: var(--hub-primary, #374151); }
    .trip-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .trip-title { font-weight: 600; font-size: 0.95rem; }
    .trip-dest { color: var(--hub-text-muted, #6b7280); font-size: 0.83rem; margin-top: 2px; }
    .trip-meta { font-size: 0.83rem; color: var(--hub-text-muted, #6b7280); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .dot { opacity: 0.35; }

    /* --- Badges --- */
    .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .badge-going { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); margin-left: auto; }

    /* --- Trip detail header --- */
    .back-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .trip-header { margin-bottom: 16px; }
    .trip-header h2 { margin-bottom: 4px; }
    .trip-header-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    /* --- Tabs --- */
    .tabs { display: flex; border-bottom: 1px solid var(--hub-border, #e5e7eb); margin-bottom: 18px; gap: 2px; }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--hub-text-muted, #6b7280);
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--hub-text, #000000); }
    .tab.active { color: var(--hub-text, #000000); border-bottom-color: var(--hub-primary, #111827); font-weight: 600; }

    /* --- Itinerary --- */
    .day-section { margin-bottom: 22px; }
    .day-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--hub-text-muted, #6b7280);
      margin-bottom: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--hub-border, #f0f0f0);
    }
    .itin-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 5px;
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
    }
    .item-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }
    .item-body { flex: 1; min-width: 0; }
    .item-title { font-weight: 500; font-size: 0.9rem; }
    .item-time { font-size: 0.78rem; color: var(--hub-text-muted, #6b7280); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .item-desc { font-size: 0.83rem; color: var(--hub-text-muted, #6b7280); margin-top: 2px; }
    .item-conf { font-size: 0.78rem; color: var(--hub-text-muted, #6b7280); margin-top: 2px; font-family: monospace; }
    .item-link a { font-size: 0.8rem; color: var(--hub-primary, #1d4ed8); text-decoration: none; margin-top: 2px; display: inline-block; }
    .item-link a:hover { text-decoration: underline; }
    .item-actions { display: flex; gap: 2px; flex-shrink: 0; }

    /* --- Packing --- */
    .packing { display: flex; flex-direction: column; gap: 14px; }
    .pack-section {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 12px);
      padding: 14px;
    }
    .pack-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 10px;
    }
    .progress-label { font-size: 0.78rem; font-weight: 500; color: var(--hub-text-muted, #6b7280); }
    .pack-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--hub-border, #f3f4f6);
    }
    .pack-item:last-of-type { border-bottom: none; }
    .pack-item.is-checked .pack-label { text-decoration: line-through; opacity: 0.45; }
    .checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--hub-border, #d1d5db);
      border-radius: 4px;
      background: none;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .checkbox.is-checked { background: var(--hub-primary, #111827); border-color: var(--hub-primary, #111827); color: var(--hub-primary-fg, #fff); }
    .checkbox.readonly { cursor: default; opacity: 0.5; }
    .pack-label { flex: 1; font-size: 0.875rem; }
    .checked-by { font-size: 0.73rem; color: var(--hub-text-muted, #9ca3af); }

    /* --- Details tab --- */
    .details { display: flex; flex-direction: column; gap: 12px; }
    .card-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--hub-text-muted, #6b7280); margin-bottom: 10px; }
    .notes-text { font-size: 0.875rem; line-height: 1.65; white-space: pre-wrap; }
    .member-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--hub-border, #f3f4f6); }
    .member-row:last-child { border-bottom: none; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; }
    .member-name { flex: 1; font-size: 0.875rem; }
    .member-toggle { margin-left: auto; }
    .member-toggle input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--hub-primary, #111827); }
    .doc-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--hub-border, #f3f4f6); font-size: 0.875rem; gap: 8px; }
    .doc-row:last-of-type { border-bottom: none; }
    .doc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .upload-row { padding-top: 10px; }
    .danger-zone { padding-top: 4px; }
    .muted { color: var(--hub-text-muted, #6b7280); font-size: 0.83rem; }

    /* --- Empty state --- */
    .empty { text-align: center; padding: 60px 16px; }
    .empty-icon { margin-bottom: 16px; }
    .empty p { color: var(--hub-text-muted, #6b7280); margin-bottom: 20px; font-size: 0.9rem; }

    /* --- Modal --- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal {
      background: var(--hub-surface, #fff);
      border-radius: var(--hub-radius, 12px);
      padding: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    }
    .modal-sub { font-size: 0.83rem; color: var(--hub-text-muted, #6b7280); margin-bottom: 14px; margin-top: -8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 4px; }

    /* --- Forms --- */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.83rem; font-weight: 500; margin-bottom: 5px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input[type="text"], input[type="url"], input[type="date"],
    input[type="time"], select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--hub-border, #d1d5db);
      border-radius: 6px;
      font-size: 0.875rem;
      font-family: inherit;
      background: var(--hub-bg, #fff);
      color: var(--hub-text, #000000);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--hub-primary, #2563eb);
      outline-offset: 1px;
      border-color: transparent;
    }
    textarea { resize: vertical; }
    .check-field label { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 400; cursor: pointer; }
    .check-field input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--hub-primary, #111827); }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import {
      hubAlert, esc, isAdult, memberColor, initial,
      hubConfirm, createFilesHelper, crossWrite, searchMatch, logHubActivity, hubToday,
      createShareHelper, activeShareLinks, SHARE_CALENDAR_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS,
      glyph, chickadee,
    } from "/hub-sdk.js";
    import { createShareUi, createOverlayView } from "./share.js";
    import {
      CAT_ICONS, STATUS_LABELS,
      nightCount, dateRange, dayLabel, formatDateRange,
      packingProgress, sortItinerary, outsideTripDates, safeHttpUrl, searchableFields,
      supervisesPacking, canAddToPackingList, canEditPackingItem, collectPages,
      canRemoveDocument, deleteTripDescription,
    } from "./logic.js";

    // ── Runtime globals ──────────────────────────────────────────────────────
    const CONTEXT = window.__CONTEXT_URL  ?? "";
    const DB      = window.__DB_URL       ?? "";
    const STORE   = window.__STORE_URL    ?? "";
    const DOCS    = window.__DOCS_URL     ?? "";
    const FILES   = window.__FILES_URL    ?? "";
    const ME      = window.__CURRENT_MEMBER ?? null;
    // Other travelers' personal packing lists: any adult at home, only the
    // steward in a shared space. The hub decides; this keeps the page from
    // offering lists that would come back empty and writes that change nothing.
    const TENANT  = { tenantKind: window.__TENANT_KIND ?? "household", spaceKind: window.__SPACE_KIND ?? null, isAdmin: window.__IS_ADMIN === true };
    const SUPERVISES_PACKING = !ME || supervisesPacking(ME, TENANT);
const EVENTS  = window.__EVENTS_URL   ?? "";

// Best-effort: the row is already written, so a failed publish is not fatal.
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // ignored on purpose
  }
}

    const APP_ID  = window.__APP_ID       ?? "trip-planner";

    const filesHelper = createFilesHelper(FILES);

    // External share links (manifest.shareable.trip): a read-only page with the
    // trip's dates and itinerary for someone outside the household — the
    // grandparents, the house-sitter. The hub injects these URLs only when the
    // manifest declares `shareable`, and mints for adults only.
    const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
    const shareView = createOverlayView(document);
    const shareUi = createShareUi({
      share,
      itemType: "trip",
      noun: "trip",
      scopeHtml: () => "The page shows the trip’s destination, dates and status, and each itinerary item’s day, time, type and details. The calendar link carries each dated itinerary item with its time and details. Trip notes, booking links, confirmation codes, packing lists and documents stay in the household. Cancelling the trip does not clear a subscribed calendar; revoke the link to stop it.",
      esc,
      glyph,
      confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
      writeText: (text) => navigator.clipboard.writeText(text),
      activeLinks: activeShareLinks,
      // A trip planned months ahead outlasts a month, and a calendar
      // subscription stops updating when its link expires.
      expiryChoices: SHARE_CALENDAR_EXPIRY_CHOICES,
      defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
      calendarUrl: (link) => share.calendarUrl(link),
      getMe: () => ME,
      isAdmin: () => window.__IS_ADMIN === true,
      memberName: (id) => memberMap.get(id)?.name ?? "",
      view: shareView,
    });
    shareView.bind(shareUi);

    // ── State ────────────────────────────────────────────────────────────────
    let members        = [];
    let memberMap      = new Map();
    let trips          = [];
    let view           = "list";  // "list" | "trip"
let searchQ = "";       // in-app search (see logic.js searchableFields)
    let currentTrip    = null;
    let tripMembers    = [];      // member IDs on current trip
    let itineraryItems = [];
    let packingItems   = [];
    let tripDocs       = [];
    let tripDocsUnread = false; // the trip's documents could not be read
    let currentTab     = "itinerary";
    let modalEl        = null;
    let loadFailed     = false; // set when the first load fails

    // ── DB helper ────────────────────────────────────────────────────────────
    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const res = await fetch(DB, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      const json = await res.json().catch(() => null);
      // The hub reports a refused write as a JSON body with an `error` key
      // (403 row policy, 400 bad statement, 507 over quota). fetch() does not
      // reject on those, so without this throw every caller's rollback and
      // error toast below is unreachable code.
      if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || `Database request failed (${res.status})`);
      return json;
    }

    // ── Load functions ───────────────────────────────────────────────────────
    /** Every document uploaded to a trip. The hub lists them a page at a time
     *  and names the next page in a header; throws if any page cannot be read. */
    function loadTripDocs(tripId) {
      return collectPages(async cursor => {
        // Bounded: Delete trip waits on this list, and a request that never
        // answers would leave that button doing nothing.
        const res = await fetch(`${DOCS}?sourceId=${encodeURIComponent(tripId)}&limit=100${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ""}`, { signal: AbortSignal.timeout(15000) });
        if (!res.ok) throw new Error(`Could not list documents (${res.status})`);
        return { items: await res.json(), next: res.headers.get("X-Documents-Next-Cursor") };
      });
    }

    async function loadMembers() {
      if (!CONTEXT) {
        members = [
          { id: "m1", name: "Alex",   role: "adult" },
          { id: "m2", name: "Jordan", role: "adult" },
          { id: "m3", name: "Riley",  role: "child" },
        ];
        memberMap = new Map(members.map(m => [m.id, m]));
        return;
      }
      // A failed read throws: it is a failed load, never a household of nobody.
      const res = await fetch(`${CONTEXT}?keys=family.members`);
      const data = await res.json().catch(() => null);
      if (!res.ok || data === null || typeof data !== "object" || Array.isArray(data)) throw new Error("Couldn’t reach the hub. Try again.");
      // A 200 that names the key in `$errors` is the hub saying it could not read it.
      if (Array.isArray(data.$errors) && data.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
      members = data["family.members"] ?? [];
      memberMap = new Map(members.map(m => [m.id, m]));
    }

    async function loadTrips() {
      const { rows } = await db(
        `SELECT id, title, destination, start_date, end_date, status, notes, created_by, created_at
         FROM app_trip_planner__trips ORDER BY start_date DESC`
      );
      if (rows.length > 0 || DB) {
        trips = rows;
        return;
      }
      // Demo fallback
      trips = [
        { id: "demo-1", title: "Paris Summer", destination: "Paris, France",
          start_date: "2026-07-10", end_date: "2026-07-24", status: "confirmed",
          notes: "Book museum tickets in advance.", created_by: "m1", created_at: new Date().toISOString() },
        { id: "demo-2", title: "Lake House Weekend", destination: "Lake Tahoe, CA",
          start_date: "2026-08-14", end_date: "2026-08-16", status: "planning",
          notes: "", created_by: "m1", created_at: new Date().toISOString() },
      ];
    }

    async function loadTripDetail(tripId) {
      const [{ rows: mRows }, { rows: iRows }, { rows: pRows }, { rows: sharedRows }] = await Promise.all([
        db(`SELECT member_id FROM app_trip_planner__trip_members WHERE trip_id = ?`, [tripId]),
        // (col IS NULL) / (col IS NOT NULL) rather than NULLS LAST / NULLS
        // FIRST: the hub's SQL rewriter cannot parse either, and unparseable
        // statements against policy-governed tables are rejected outright.
        db(`SELECT * FROM app_trip_planner__itinerary_items WHERE trip_id = ? ORDER BY (item_date IS NULL), item_date, sort_order, created_at`, [tripId]),
        db(`SELECT * FROM app_trip_planner__packing_items WHERE trip_id = ? ORDER BY (member_id IS NOT NULL), member_id, created_at`, [tripId]),
        db(`SELECT * FROM app_trip_planner__shared_packing_items WHERE trip_id = ? ORDER BY created_at`, [tripId]),
      ]);

      tripMembers    = mRows.map(r => r.member_id);
      itineraryItems = iRows;
      packingItems   = [
        ...pRows.map(row => ({ ...row, shared: false })),
        ...sharedRows.map(row => ({ ...row, member_id: null, shared: true })),
      ];
      tripDocs       = [];
      tripDocsUnread = false;

      if (DOCS) {
        // Non-fatal, but remembered: a list that could not be read is not "none yet".
        try { tripDocs = await loadTripDocs(tripId); } catch { tripDocsUnread = true; }
      }
    }

    // ── Calendar export ──────────────────────────────────────────────────────
    async function publishTrips() {
      if (!STORE) return;
      // calendar_events is store_acls write:adult — non-adults would 403, so skip.
      if (ME && !isAdult(ME)) return;
      // Re-read before publishing. This writes the WHOLE calendar_events array,
      // so building it from this tab's in-memory `trips` meant a client holding
      // a stale list republished trips other members had already deleted —
      // resurrecting them on everyone's calendar with no way to tell where they
      // came from. The database is the source of truth at the moment of the
      // write, not whatever this page loaded earlier.
      let source = trips;
      try {
        const { rows } = await db(
          `SELECT id, title, destination, start_date, end_date, status FROM app_trip_planner__trips`,
        );
        if (rows) source = rows;
      } catch { /* fall back to the in-memory list rather than skipping the export */ }
      const events = source
        .filter(t => t.status !== "cancelled")
        .map(t => ({
          id:           t.id,
          title:        t.title,
          description:  t.destination || "",
          start:        t.start_date,
          end:          t.end_date,
          all_day:      true,
          source_label: "Trip Planner",
        }));
      fetch(STORE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: "calendar_events", value: JSON.stringify(events) }),
      }).catch(() => {});
    }

    // ── Navigation ───────────────────────────────────────────────────────────
    async function openTrip(trip) {
      currentTrip = trip;
      currentTab  = "itinerary";
      view        = "trip";
      try {
        await loadTripDetail(trip.id);
      } catch (e) {
        goBack();
        console.error(e);
        hubAlert("Couldn’t open this trip.");
        return;
      }
      render();
    }

    function goBack() {
      view        = "list";
      currentTrip = null;
      render();
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function statusBadge(status) {
      const styles = {
        planning:  "background:#dbeafe;color:#1e40af",
        confirmed: "background:#dcfce7;color:#166534",
        completed: "background:#f3f4f6;color:#374151",
        cancelled: "background:#fee2e2;color:#991b1b",
      };
      return `<span class="badge" style="${styles[status] ?? styles.planning}">${esc(STATUS_LABELS[status] ?? status)}</span>`;
    }

    function jsArg(value) {
      return esc(JSON.stringify(String(value)));
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render() {
      view === "list" ? renderList() : renderTrip();
    }

    // renderList rewrites the whole page, so put the caret back after typing.
    document.addEventListener("input", (e) => {
      if (e.target.id !== "search") return;
      searchQ = e.target.value;
      const caret = e.target.selectionStart;
      renderList();
      const next = document.getElementById("search");
      if (next) { next.focus(); next.setSelectionRange(caret, caret); }
    });

    function renderList() {
      const canCreate = !ME || isAdult(ME);
      const today     = hubToday();
      const matched   = searchQ ? trips.filter(t => searchMatch(searchQ, searchableFields(t))) : trips;
      const upcoming  = matched.filter(t => t.end_date >= today && t.status !== "cancelled");
      const past      = matched.filter(t => t.end_date < today || t.status === "cancelled");

      document.getElementById("app").innerHTML = `
        <div class="page">
          <div class="header">
            <h1>${glyph("plane")} Trips</h1>
            ${canCreate && !loadFailed ? `<button class="btn-primary" onclick="window._newTrip()">+ New trip</button>` : ""}
          </div>

          ${trips.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search trips…" aria-label="Search trips" value="${esc(searchQ)}" /></div>` : ""}
          ${loadFailed ? `
            <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the trips.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>
          ` : matched.length === 0 ? (searchQ ? `
            <div class="empty">
              <div class="empty-icon">${chickadee("searching")}</div>
              <p>No trips match "${esc(searchQ)}".</p>
            </div>
          ` : `
            <div class="empty">
              <div class="empty-icon">${chickadee("nest")}</div>
              <p>No trips planned yet.</p>
              ${canCreate ? `<button class="btn-primary" onclick="window._newTrip()">Plan a trip</button>` : ""}
            </div>
          `) : `
            ${upcoming.length > 0 ? `
              <div class="section-label">Upcoming</div>
              ${upcoming.map(tripCard).join("")}
            ` : ""}
            ${past.length > 0 ? `
              <div class="section-label" style="margin-top:20px">Past</div>
              ${past.map(tripCard).join("")}
            ` : ""}
          `}
        </div>
      `;
    }

    function tripCard(trip) {
      const nights = nightCount(trip.start_date, trip.end_date);
      return `
        <div class="card trip-card" data-testid="trip-card" data-trip-id="${esc(trip.id)}" onclick="window._openTripById(${jsArg(trip.id)})">
          <div class="trip-card-header">
            <div>
              <div class="trip-title">${esc(trip.title)}</div>
              ${trip.destination ? `<div class="trip-dest">${glyph("location")} ${esc(trip.destination)}</div>` : ""}
            </div>
            ${statusBadge(trip.status)}
          </div>
          <div class="trip-meta">
            <span>${esc(formatDateRange(trip.start_date, trip.end_date))}</span>
            <span class="dot">·</span>
            <span>${nights} night${nights !== 1 ? "s" : ""}</span>
          </div>
        </div>
      `;
    }

    function renderTrip() {
      const t       = currentTrip;
      const isAdmin = !ME || isAdult(ME);
      document.getElementById("app").innerHTML = `
        <div class="page">
          <div class="back-bar">
            <button class="btn-back" onclick="window._goBack()">← Trips</button>
            <div style="display:flex;gap:6px">
              ${share.enabled && ME && isAdult(ME) ? `<button class="btn-ghost btn-sm" onclick="window._shareTrip()" data-testid="trip-share">Share</button>` : ""}
              ${isAdmin ? `<button class="btn-ghost btn-sm" data-testid="trip-edit" onclick="window._editTrip()">Edit</button>` : ""}
            </div>
          </div>

          <div class="trip-header">
            <h2>${esc(t.title)}</h2>
            ${t.destination ? `<div class="trip-dest">${glyph("location")} ${esc(t.destination)}</div>` : ""}
            <div class="trip-header-meta">
              <span>${esc(formatDateRange(t.start_date, t.end_date))}</span>
              <span class="dot">·</span>
              <span>${nightCount(t.start_date, t.end_date)} nights</span>
              <span class="dot">·</span>
              ${statusBadge(t.status)}
            </div>
          </div>

          <div class="tabs">
            <button class="tab${currentTab === "itinerary" ? " active" : ""}" data-testid="trip-tab" data-tab="itinerary" onclick="window._setTab('itinerary')">Itinerary</button>
            <button class="tab${currentTab === "packing"   ? " active" : ""}" data-testid="trip-tab" data-tab="packing" onclick="window._setTab('packing')">Packing</button>
            <button class="tab${currentTab === "details"   ? " active" : ""}" data-testid="trip-tab" data-tab="details" onclick="window._setTab('details')">Details</button>
          </div>

          <div id="tab-content">
            ${renderTab()}
          </div>
        </div>
      `;
    }

    function renderTab() {
      if (currentTab === "itinerary") return renderItinerary();
      if (currentTab === "packing")   return renderPacking();
      return renderDetails();
    }

    function refreshTab() {
      const el = document.getElementById("tab-content");
      if (el) el.innerHTML = renderTab();
    }

    // ── Itinerary tab ────────────────────────────────────────────────────────
    function renderItinerary() {
      const isAdmin = !ME || isAdult(ME);
      const dates   = dateRange(currentTrip.start_date, currentTrip.end_date);

      const unscheduled = itineraryItems.filter(i => !i.item_date);

      const dayHtml = dates.map(date => {
        const items = itineraryItems.filter(i => i.item_date === date);
        return `
          <div class="day-section" data-testid="day-section" data-date="${esc(date)}">
            <div class="day-label">${esc(dayLabel(date))}</div>
            ${items.map(itinItemHtml).join("")}
            ${isAdmin ? `<button class="btn-add" data-testid="itin-add" data-date="${esc(date)}" onclick="window._newItem(${jsArg(date)})">+ Add item</button>` : ""}
          </div>
        `;
      }).join("");

      const outside = outsideTripDates(itineraryItems, currentTrip.start_date, currentTrip.end_date);
      const outsideHtml = outside.length ? `
        <div class="day-section" data-testid="outside-dates-section">
          <div class="day-label" style="opacity:0.6">Outside trip dates</div>
          ${outside.map(i => itinItemHtml(i, { showDate: true })).join("")}
        </div>
      ` : "";

      const unschHtml = (unscheduled.length > 0 || isAdmin) ? `
        <div class="day-section" data-testid="day-section" data-date="unscheduled">
          <div class="day-label" style="opacity:0.6">Unscheduled</div>
          ${unscheduled.map(itinItemHtml).join("")}
          ${isAdmin ? `<button class="btn-add" data-testid="itin-add" data-date="unscheduled" onclick="window._newItem(null)">+ Add unscheduled item</button>` : ""}
        </div>
      ` : "";

      return `<div class="itinerary">${dayHtml}${outsideHtml}${unschHtml}</div>`;
    }

    function itinItemHtml(item, { showDate = false } = {}) {
      const icon    = glyph(CAT_ICONS[item.category] ?? "pinboard");
      const isAdmin = !ME || isAdult(ME);
      const bookingUrl = safeHttpUrl(item.booking_url);
      return `
        <div class="itin-item" data-testid="itin-item" data-item-id="${esc(item.id)}">
          <span class="item-icon">${icon}</span>
          <div class="item-body">
            <div class="item-title">${esc(item.title)}</div>
            ${showDate              ? `<div class="item-time">${esc(dayLabel(item.item_date))}${item.time ? ` · ${esc(item.time)}` : ""}</div>`
              : item.time           ? `<div class="item-time">${esc(item.time)}</div>` : ""}
            ${item.description      ? `<div class="item-desc">${esc(item.description)}</div>` : ""}
            ${item.confirmation_code ? `<div class="item-conf">Conf: ${esc(item.confirmation_code)}</div>` : ""}
            ${bookingUrl ? `<div class="item-link"><a href="${esc(bookingUrl)}" target="_blank" rel="noopener noreferrer">View booking ↗</a></div>` : ""}
          </div>
          ${isAdmin ? `
            <div class="item-actions" data-testid="itin-item-actions" data-item-id="${esc(item.id)}">
              <button class="btn-icon" title="Edit" aria-label="Edit" onclick="window._editItem(${jsArg(item.id)})">${glyph("pencil")}</button>
              <button class="btn-icon" title="Remove" aria-label="Remove" onclick="window._deleteItem(${jsArg(item.id)})">${glyph("trash")}</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    // ── Packing tab ──────────────────────────────────────────────────────────
    function renderPacking() {
      const myId    = ME?.id ?? null;

      const myItems     = myId ? packingItems.filter(i => i.member_id === myId) : [];
      const sharedItems = packingItems.filter(i => !i.member_id);
      const otherTravelers = SUPERVISES_PACKING && myId
        ? members.filter(m => m.id !== myId && tripMembers.includes(m.id))
        : [];

      function section(title, items, memberId) {
        const pct  = packingProgress(items);
        // The shared list (memberId === null) is any adult's to add to. A specific
        // member's personal list is for its owner and whoever supervises.
        const canAdd = !ME || canAddToPackingList(memberId, ME, TENANT);
        return `
          <div class="pack-section" data-testid="pack-section" data-list="${memberId === null ? "shared" : memberId === myId ? "mine" : "member"}" data-member-id="${esc(memberId ?? "")}">
            <div class="pack-section-header">
              <span>${esc(title)}</span>
              ${pct !== null ? `<span class="progress-label" data-testid="pack-progress">${pct}%</span>` : ""}
            </div>
            ${items.map(i => packItemHtml(i, myId)).join("")}
            ${items.length === 0 ? `<p class="muted" style="padding:4px 0 6px">Nothing added yet.</p>` : ""}
            ${canAdd ? `<button class="btn-add" data-testid="pack-add" onclick="window._addPacking(${memberId ? jsArg(memberId) : "null"})">+ Add item</button>` : ""}
          </div>
        `;
      }

      return `
        <div class="packing">
          ${myId ? section("My list", myItems, myId) : ""}
          ${section("Shared list", sharedItems, null)}
          ${otherTravelers.map(m => {
            const items = packingItems.filter(i => i.member_id === m.id);
            return section(`${m.name}'s list`, items, m.id);
          }).join("")}
          ${ME && isAdult(ME) && !SUPERVISES_PACKING ? `<p class="muted" data-testid="pack-scope-note">In a shared space, the steward sees everyone's lists.</p>` : ""}
        </div>
      `;
    }

    function packItemHtml(item, myId) {
      // Shared items are any adult's to tick or remove. Personal items are for
      // their owner and whoever supervises.
      const canToggle = !ME || canEditPackingItem(item, ME, TENANT);
      const canDelete = canToggle;
      const checkerName = item.checked_by ? (memberMap.get(item.checked_by)?.name ?? item.checked_by) : null;
      return `
        <div class="pack-item${item.checked ? " is-checked" : ""}" data-testid="pack-item" data-pack-id="${esc(item.id)}">
          <button class="checkbox${item.checked ? " is-checked" : ""}${!canToggle ? " readonly" : ""}"
            ${canToggle ? `onclick="window._togglePacking(${jsArg(item.id)})"` : ""}
            aria-label="${item.checked ? "Uncheck" : "Check"}"
          >${item.checked ? glyph("tick") : ""}</button>
          <span class="pack-label">${esc(item.label)}</span>
          ${checkerName && item.checked ? `<span class="checked-by">${esc(checkerName)}</span>` : ""}
          ${canDelete ? `<button class="btn-icon-sm" data-testid="pack-remove" title="Remove" onclick="window._deletePacking(${jsArg(item.id)})">×</button>` : ""}
        </div>
      `;
    }

    // ── Details tab ──────────────────────────────────────────────────────────
    function renderDetails() {
      const t       = currentTrip;
      const isAdmin = !ME || isAdult(ME);

      const docRows = tripDocs.map(doc => `
        <div class="doc-row">
          <span class="doc-name">${glyph("document")} ${esc(doc.title)}</span>
          <div class="doc-actions">
            ${doc.fileKey ? `<a class="btn-ghost btn-sm" href="${esc(filesHelper.url(doc.fileKey))}" target="_blank" rel="noopener">Download</a>` : ""}
            ${!ME || canRemoveDocument(doc, ME, TENANT.isAdmin) ? `<button class="btn-ghost btn-sm" data-testid="doc-remove" onclick="window._deleteDoc(${jsArg(doc.id)})">Remove</button>` : ""}
          </div>
        </div>
      `).join("");

      return `
        <div class="details">
          ${t.notes ? `
            <div class="card">
              <div class="card-label">Notes</div>
              <div class="notes-text">${esc(t.notes)}</div>
              ${isAdmin ? `<button class="btn-ghost btn-sm" style="margin-top:10px" onclick="window._editTrip()">Edit notes</button>` : ""}
            </div>
          ` : isAdmin ? `
            <div class="card" style="border-style:dashed;text-align:center">
              <button class="btn-ghost" onclick="window._editTrip()">+ Add notes</button>
            </div>
          ` : ""}

          <div class="card">
            <div class="card-label">Who's coming</div>
            ${members.map(m => `
              <div class="member-row">
                <div class="avatar" style="background:${esc(memberColor(m.id, members))}">${esc(initial(m.name))}</div>
                <span class="member-name">${esc(m.name)}</span>
                ${isAdmin
                  ? `<label class="member-toggle" title="${tripMembers.includes(m.id) ? "Remove from trip" : "Add to trip"}">
                       <input type="checkbox" ${tripMembers.includes(m.id) ? "checked" : ""}
                         onchange="window._toggleMember(${jsArg(m.id)}, this.checked)">
                     </label>`
                  : tripMembers.includes(m.id) ? `<span class="badge-going">Going</span>` : ""
                }
              </div>
            `).join("")}
          </div>

          ${DOCS ? `
            <div class="card">
              <div class="card-label">Documents</div>
              ${docRows || `<p class="muted">${tripDocsUnread ? "Couldn’t load the documents." : "No documents uploaded yet."}</p>`}
              ${isAdmin ? `
                <div class="upload-row">
                  <input type="file" id="doc-upload"
                    accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.txt,.md"
                    style="display:none"
                    onchange="window._uploadDoc(this)">
                  <button class="btn-ghost btn-sm" onclick="document.getElementById('doc-upload').click()">
                    + Upload booking confirmation
                  </button>
                </div>
              ` : ""}
            </div>
          ` : ""}

          ${isAdmin ? `
            <div class="danger-zone">
              <button class="btn-danger" data-testid="trip-delete" onclick="window._deleteTrip()">Delete trip</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    // ── Modal helpers ─────────────────────────────────────────────────────────
    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
    }

    function closeModal() { modalEl?.remove(); modalEl = null; }

    // ── New / edit trip ───────────────────────────────────────────────────────
    window._newTrip = function() {
      openModal(`
        <h3>New Trip</h3>
        <div class="field">
          <label>Title</label>
          <input id="f-title" type="text" placeholder="Summer vacation…" maxlength="120">
        </div>
        <div class="field">
          <label>Destination</label>
          <input id="f-dest" type="text" placeholder="Paris, France" maxlength="200">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Start date</label>
            <input id="f-start" type="date">
          </div>
          <div class="field">
            <label>End date</label>
            <input id="f-end" type="date">
          </div>
        </div>
        <div class="field">
          <label>Notes (optional)</label>
          <textarea id="f-notes" rows="3" placeholder="Ideas, links, reminders…"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="window._submitNewTrip()">Create trip</button>
        </div>
      `);
      setTimeout(() => document.getElementById("f-title")?.focus(), 50);
    };

    window._submitNewTrip = async function() {
      const title = document.getElementById("f-title").value.trim();
      const dest  = document.getElementById("f-dest").value.trim();
      const start = document.getElementById("f-start").value;
      const end   = document.getElementById("f-end").value;
      const notes = document.getElementById("f-notes").value.trim();

      if (!title) { document.getElementById("f-title").focus(); return; }
      if (!start || !end) { hubAlert("Please set start and end dates."); return; }
      if (start > end) { hubAlert("End date must be on or after start date."); return; }

      const btn = modalEl?.querySelector(".btn-primary");
      if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }

      try {
        const id  = crypto.randomUUID();
        const now = new Date().toISOString();

        await db(
          `INSERT INTO app_trip_planner__trips (id, title, destination, start_date, end_date, status, notes, created_by, created_at)
           VALUES (?, ?, ?, ?, ?, 'planning', ?, ?, ?)`,
          [id, title, dest, start, end, notes, ME?.id ?? "system", now]
        );

        if (ME?.id) {
          await db(
            `INSERT INTO app_trip_planner__trip_members (id, trip_id, member_id, added_at) VALUES (?, ?, ?, ?)`,
            [crypto.randomUUID(), id, ME.id, now]
          );
        }

        const newTrip = { id, title, destination: dest, start_date: start, end_date: end,
          status: "planning", notes, created_by: ME?.id ?? "system", created_at: now };
        trips = [newTrip, ...trips].sort((a, b) => b.start_date.localeCompare(a.start_date));
        await publishEvent("trip.created", id, {
          title, destination: dest, start_date: start, end_date: end,
          created_by: ME?.id,
        });
        closeModal();
        publishTrips();

        // The trip.created event above and this feed line are different sinks,
        // not duplicates: the event is machine-readable (automations, digests)
        // and never rendered to anyone, while this is the household's
        // human-readable "what happened" log. `trips` is adult_writable, so the
        // title and destination named here are already household-readable.
        logHubActivity(
          `${ME?.name ?? "Someone"} planned a trip: ${title}${dest ? ` to ${dest}` : ""}`,
          { deepLink: { appId: APP_ID, params: { trip: id } } },
        );

        await openTrip(newTrip);
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Create trip"; }
        console.error(e);
        hubAlert("Couldn’t create the trip — try again.");
      }
    };

    window._shareTrip = function() {
      if (currentTrip) shareUi.open({ id: currentTrip.id, title: currentTrip.title });
    };

    window._editTrip = function() {
      const t = currentTrip;
      openModal(`
        <h3>Edit Trip</h3>
        <div class="field">
          <label>Title</label>
          <input id="f-title" type="text" value="${esc(t.title)}" maxlength="120">
        </div>
        <div class="field">
          <label>Destination</label>
          <input id="f-dest" type="text" value="${esc(t.destination)}" maxlength="200">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Start date</label>
            <input id="f-start" type="date" value="${esc(t.start_date)}">
          </div>
          <div class="field">
            <label>End date</label>
            <input id="f-end" type="date" value="${esc(t.end_date)}">
          </div>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            ${["planning","confirmed","completed","cancelled"].map(s =>
              `<option value="${s}"${t.status === s ? " selected" : ""}>${STATUS_LABELS[s]}</option>`
            ).join("")}
          </select>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="f-notes" rows="4">${esc(t.notes)}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="window._submitEditTrip()">Save</button>
        </div>
      `);
    };

    window._submitEditTrip = async function() {
      const title  = document.getElementById("f-title").value.trim();
      const dest   = document.getElementById("f-dest").value.trim();
      const start  = document.getElementById("f-start").value;
      const end    = document.getElementById("f-end").value;
      const status = document.getElementById("f-status").value;
      const notes  = document.getElementById("f-notes").value.trim();

      if (!title) { document.getElementById("f-title").focus(); return; }
      if (start > end) { hubAlert("End date must be on or after start date."); return; }

      const btn = modalEl?.querySelector(".btn-primary");
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

      try {
        await db(
          `UPDATE app_trip_planner__trips SET title=?, destination=?, start_date=?, end_date=?, status=?, notes=? WHERE id=?`,
          [title, dest, start, end, status, notes, currentTrip.id]
        );

        Object.assign(currentTrip, { title, destination: dest, start_date: start, end_date: end, status, notes });
        const idx = trips.findIndex(t => t.id === currentTrip.id);
        if (idx !== -1) trips[idx] = { ...trips[idx], ...currentTrip };

        closeModal();
        publishTrips();
        renderTrip();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Save"; }
        console.error(e);
        hubAlert("Couldn’t save the trip — try again.");
      }
    };

    // ── Itinerary CRUD ───────────────────────────────────────────────────────
    window._newItem = function(date) {
      openModal(`
        <h3>Add Item</h3>
        ${date ? `<div class="modal-sub">${esc(dayLabel(date))}</div>` : ""}
        <div class="field">
          <label>Title</label>
          <input id="f-title" type="text" placeholder="Flight, hotel check-in, dinner…" maxlength="200">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Category</label>
            <select id="f-cat">
              <option value="transport">Transport</option>
              <option value="accommodation">Accommodation</option>
              <option value="activity">Activity</option>
              <option value="restaurant">Restaurant</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label>Time (optional)</label>
            <input id="f-time" type="time">
          </div>
        </div>
        <div class="field">
          <label>Description (optional)</label>
          <input id="f-desc" type="text" maxlength="500" placeholder="Notes, address…">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Confirmation # (optional)</label>
            <input id="f-conf" type="text" maxlength="100" placeholder="ABC123">
          </div>
          <div class="field">
            <label>Booking URL (optional)</label>
            <input id="f-url" type="url" placeholder="https://…">
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="window._submitNewItem(${date ? jsArg(date) : "null"})">Add item</button>
        </div>
      `);
      setTimeout(() => document.getElementById("f-title")?.focus(), 50);
    };

    window._submitNewItem = async function(date) {
      const title = document.getElementById("f-title").value.trim();
      const cat   = document.getElementById("f-cat").value;
      const time  = document.getElementById("f-time").value || null;
      const desc  = document.getElementById("f-desc").value.trim();
      const conf  = document.getElementById("f-conf").value.trim();
      const url   = document.getElementById("f-url").value.trim();

      if (!title) { document.getElementById("f-title").focus(); return; }

      const btn = modalEl?.querySelector(".btn-primary");
      if (btn) { btn.disabled = true; btn.textContent = "Adding…"; }

      try {
        const id    = crypto.randomUUID();
        const now   = new Date().toISOString();
        const sort  = itineraryItems.filter(i => i.item_date === date).length;

        await db(
          `INSERT INTO app_trip_planner__itinerary_items
             (id, trip_id, item_date, sort_order, time, title, description, category, booking_url, confirmation_code, created_by, created_at)
           VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
          [id, currentTrip.id, date, sort, time, title, desc, cat, url, conf, ME?.id ?? "system", now]
        );

        const newItem = { id, trip_id: currentTrip.id, item_date: date, sort_order: sort,
          time, title, description: desc, category: cat, booking_url: url,
          confirmation_code: conf, created_by: ME?.id ?? "system", created_at: now };
        itineraryItems = sortItinerary([...itineraryItems, newItem]);

        closeModal();
        refreshTab();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Add item"; }
        console.error(e);
        hubAlert("Couldn’t add the item — try again.");
      }
    };

    window._editItem = function(itemId) {
      const item = itineraryItems.find(i => i.id === itemId);
      if (!item) return;
      openModal(`
        <h3>Edit Item</h3>
        <div class="field">
          <label>Title</label>
          <input id="f-title" type="text" value="${esc(item.title)}" maxlength="200">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Category</label>
            <select id="f-cat">
              ${["transport","accommodation","activity","restaurant","other"].map(c =>
                `<option value="${c}"${item.category === c ? " selected" : ""}>${c.charAt(0).toUpperCase() + c.slice(1)}</option>`
              ).join("")}
            </select>
          </div>
          <div class="field">
            <label>Time</label>
            <input id="f-time" type="time" value="${esc(item.time ?? "")}">
          </div>
        </div>
        <div class="field">
          <label>Description</label>
          <input id="f-desc" type="text" value="${esc(item.description)}" maxlength="500">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Confirmation #</label>
            <input id="f-conf" type="text" value="${esc(item.confirmation_code)}" maxlength="100">
          </div>
          <div class="field">
            <label>Booking URL</label>
            <input id="f-url" type="url" value="${esc(item.booking_url)}">
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="window._submitEditItem(${jsArg(itemId)})">Save</button>
        </div>
      `);
    };

    window._submitEditItem = async function(itemId) {
      const title = document.getElementById("f-title").value.trim();
      const cat   = document.getElementById("f-cat").value;
      const time  = document.getElementById("f-time").value || null;
      const desc  = document.getElementById("f-desc").value.trim();
      const conf  = document.getElementById("f-conf").value.trim();
      const url   = document.getElementById("f-url").value.trim();

      if (!title) { document.getElementById("f-title").focus(); return; }

      const btn = modalEl?.querySelector(".btn-primary");
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

      try {
        await db(
          `UPDATE app_trip_planner__itinerary_items SET title=?, category=?, time=?, description=?, confirmation_code=?, booking_url=? WHERE id=?`,
          [title, cat, time, desc, conf, url, itemId]
        );

        const idx = itineraryItems.findIndex(i => i.id === itemId);
        if (idx !== -1) {
          itineraryItems[idx] = { ...itineraryItems[idx], title, category: cat, time, description: desc, confirmation_code: conf, booking_url: url };
        }
        closeModal();
        refreshTab();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Save"; }
        console.error(e);
        hubAlert("Couldn’t save the item — try again.");
      }
    };

    window._deleteItem = async function(itemId) {
      const ok = await hubConfirm({ message: "Remove this item?", destructive: true });
      if (!ok) return;
      try {
        await db(`DELETE FROM app_trip_planner__itinerary_items WHERE id=?`, [itemId]);
      } catch (e) {
        console.error(e);
        hubAlert("Couldn’t remove the item — try again.");
        return;
      }
      itineraryItems = itineraryItems.filter(i => i.id !== itemId);
      refreshTab();
    };

    // ── Packing CRUD ─────────────────────────────────────────────────────────
    window._addPacking = function(memberId) {
      const isShared  = !memberId;
      const isOwnList = memberId === ME?.id;

      openModal(`
        <h3>${isShared ? "Add to shared list" : isOwnList ? "Add to my list" : `Add to ${esc(memberMap.get(memberId)?.name ?? "")}'s list`}</h3>
        <div class="field">
          <input id="f-label" type="text" placeholder="Sunscreen, travel adapter, passport…" maxlength="200">
        </div>
        ${isShared ? `
          <div class="field check-field">
            <label><input type="checkbox" id="f-grocery"> Also add to shopping list</label>
          </div>
        ` : ""}
        <div class="modal-actions">
          <button class="btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="window._submitAddPacking(${memberId ? jsArg(memberId) : "null"})">Add</button>
        </div>
      `);
      setTimeout(() => document.getElementById("f-label")?.focus(), 50);
    };

    window._submitAddPacking = async function(memberId) {
      const label     = document.getElementById("f-label").value.trim();
      const toGrocery = document.getElementById("f-grocery")?.checked ?? false;

      if (!label) { document.getElementById("f-label").focus(); return; }

      const btn = modalEl?.querySelector(".btn-primary");
      if (btn) { btn.disabled = true; btn.textContent = "Adding…"; }

      try {
        const id  = crypto.randomUUID();
        const now = new Date().toISOString();

        if (memberId) {
          await db(
            `INSERT INTO app_trip_planner__packing_items (id, trip_id, member_id, label, checked, created_at)
             VALUES (?, ?, ?, ?, 0, ?)`,
            [id, currentTrip.id, memberId, label, now]
          );
        } else {
          await db(
            `INSERT INTO app_trip_planner__shared_packing_items (id, trip_id, label, checked, created_at)
             VALUES (?, ?, ?, 0, ?)`,
            [id, currentTrip.id, label, now]
          );
        }

        packingItems = [...packingItems,
          { id, trip_id: currentTrip.id, member_id: memberId, label, checked: 0, checked_by: null, checked_at: null, created_at: now, shared: !memberId }
        ];
        closeModal();
        refreshTab();

        if (toGrocery) {
          crossWrite("grocery", "pending_items", [
            { op: "array_append", path: "items", value: { name: label, addedBy: `Trip Planner (${currentTrip.title})` } },
          ]).catch(() => {});
        }
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Add"; }
        console.error(e);
        hubAlert("Couldn’t add the item — try again.");
      }
    };

    window._togglePacking = async function(itemId) {
      const item = packingItems.find(i => i.id === itemId);
      if (!item) return;
      const newChecked = item.checked ? 0 : 1;
      const now        = new Date().toISOString();

      const table = item.shared
        ? "app_trip_planner__shared_packing_items"
        : "app_trip_planner__packing_items";
      try {
        const { changed } = await db(
          `UPDATE ${table} SET checked=?, checked_by=?, checked_at=? WHERE id=?`,
          [newChecked, newChecked ? (ME?.id ?? null) : null, newChecked ? now : null, itemId]
        );
        // Nothing changed: the item was removed, or is not this member's to tick.
        if (DB && changed === 0) {
          hubAlert("This item can no longer be changed.");
          return;
        }
      } catch (e) {
        console.error(e);
        hubAlert("Couldn’t update the item — try again.");
        return;
      }

      const idx = packingItems.findIndex(i => i.id === itemId);
      if (idx !== -1) {
        packingItems[idx] = { ...packingItems[idx], checked: newChecked,
          checked_by: newChecked ? (ME?.id ?? null) : null,
          checked_at: newChecked ? now : null };
      }
      refreshTab();
    };

    window._deletePacking = async function(itemId) {
      const item = packingItems.find(i => i.id === itemId);
      if (!item) return;
      const table = item.shared
        ? "app_trip_planner__shared_packing_items"
        : "app_trip_planner__packing_items";
      try {
        await db(`DELETE FROM ${table} WHERE id=?`, [itemId]);
      } catch (e) {
        console.error(e);
        hubAlert("Couldn’t remove the item — try again.");
        return;
      }
      packingItems = packingItems.filter(i => i.id !== itemId);
      refreshTab();
    };

    // ── Trip members ─────────────────────────────────────────────────────────
    window._toggleMember = async function(memberId, adding) {
      try {
        if (adding) {
          await db(
            `INSERT INTO app_trip_planner__trip_members (id, trip_id, member_id, added_at)
             VALUES (?, ?, ?, ?)
             ON CONFLICT (trip_id, member_id) DO NOTHING`,
            [crypto.randomUUID(), currentTrip.id, memberId, new Date().toISOString()]
          );
          if (!tripMembers.includes(memberId)) tripMembers = [...tripMembers, memberId];
        } else {
          await db(`DELETE FROM app_trip_planner__trip_members WHERE trip_id=? AND member_id=?`, [currentTrip.id, memberId]);
          tripMembers = tripMembers.filter(id => id !== memberId);
        }
      } catch (e) {
        // The checkbox was already flipped by the tap; redraw it from what was saved.
        refreshTab();
        console.error(e);
        hubAlert("Couldn’t update who is coming — try again.");
      }
    };

    // ── Documents ────────────────────────────────────────────────────────────
    window._uploadDoc = async function(input) {
      const file = input.files[0];
      if (!file) return;
      input.value = "";

      try {
        const { id: fileKey } = await filesHelper.upload(file);
        const res = await fetch(DOCS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title:     file.name,
            category:  "other",
            fileKey,
            mimeType:  file.type,
            sizeBytes: file.size,
            sourceId:  currentTrip.id,
            folder:    currentTrip.title,
            sharedWith: ["everyone"],
          }),
        });
        if (!res.ok) throw new Error(`Upload failed (${res.status})`);
        const doc = await res.json();
        tripDocs = [...tripDocs, doc];
        refreshTab();
      } catch (e) {
        hubAlert(`Upload failed: ${e.message}`);
      }
    };

    // Removing the document is enough: the hub takes the file with it, unless
    // another document still names that file.
    // Resolves to "removed" (already gone counts), "refused" or "failed".
    async function removeDoc(docId) {
      try {
        const res = await fetch(`${DOCS}/${docId}`, { method: "DELETE" });
        if (res.ok || res.status === 404) return "removed";
        return res.status === 403 ? "refused" : "failed";
      } catch { return "failed"; }
    }

    window._deleteDoc = async function(docId) {
      const ok = await hubConfirm({ message: "Remove this document?", destructive: true });
      if (!ok) return;
      const outcome = await removeDoc(docId);
      if (outcome !== "removed") {
        hubAlert("Could not remove this document.", { description: outcome === "refused" ? "Only whoever uploaded it, or an admin, can remove it." : "Check your connection and try again." });
        return;
      }
      tripDocs = tripDocs.filter(d => d.id !== docId);
      refreshTab();
    };

    // ── Delete trip ───────────────────────────────────────────────────────────
    let deletingTrip = false;
    window._deleteTrip = async function() {
      // The documents are listed before the question is asked, so a second tap
      // in that pause must not start a second delete.
      if (deletingTrip || !currentTrip) return;
      deletingTrip = true;
      try { await deleteCurrentTrip(); } finally { deletingTrip = false; }
    };

    async function deleteCurrentTrip() {
      const tripId = currentTrip.id;
      const title  = currentTrip.title;
      // The trip's uploaded documents live in the household's documents, not in
      // this app's tables, so no cascade reaches them. Read the list in full
      // before asking: the one drawn with the trip is empty whenever that
      // earlier read failed, and the question has to say what will be left.
      let docs = [];
      let unread = false;
      if (DOCS) {
        try { docs = await loadTripDocs(tripId); } catch { unread = true; }
      }
      const removable = docs.filter(doc => !ME || canRemoveDocument(doc, ME, TENANT.isAdmin));
      const ok = await hubConfirm({
        message:      `Delete "${title}"?`,
        description:  deleteTripDescription({ removable: removable.length, staying: docs.length - removable.length, unread }),
        confirmLabel: "Delete",
        destructive:  true,
      });
      if (!ok) return;

      // One statement. The manifest's delete_cascades takes the trip's
      // travelers, itinerary and both packing lists with it in the same
      // transaction, including personal lists the caller cannot read.
      let gone = false;
      try {
        const { changed } = await db(`DELETE FROM app_trip_planner__trips WHERE id=?`, [tripId]);
        // Nothing changed: someone else deleted it first. It is gone either way.
        gone = DB && changed === 0;
      } catch (e) {
        console.error(e);
        await hubAlert("Couldn’t delete the trip — try again.");
        return;
      }

      // Leave the trip and republish before anything that can wait on a
      // dialog, so the calendar never keeps a trip that no longer exists.
      trips = trips.filter(t => t.id !== tripId);
      // Only leave the trip if it is still the one on screen.
      if (currentTrip?.id === tripId) { tripDocs = []; goBack(); } else render();
      await publishTrips().catch(() => {});

      // The documents go whether this delete removed the trip or found it
      // already gone: either way nothing in the app can reach them afterwards.
      const kept = (await Promise.all(removable.map(doc => removeDoc(doc.id)))).filter(outcome => outcome !== "removed").length;
      if (kept) hubAlert("The trip was deleted, but not all of its documents.", { description: `${kept === 1 ? "One document" : `${kept} documents`} could not be removed and ${kept === 1 ? "is" : "are"} still in Documents.` });
      else if (gone) hubAlert(`"${title}" had already been deleted.`);
    }

    // ── Exposed globals ───────────────────────────────────────────────────────
    window._goBack       = goBack;
    window.closeModal    = closeModal;
    window._setTab       = function(tab) { currentTab = tab; renderTrip(); };
    window._openTripById = function(id) {
      const trip = trips.find(t => t.id === id);
      if (trip) openTrip(trip);
    };

    function handleDeepLink() {
      const params = new URLSearchParams(window.location.search);
      const tripId = params.get("tripId");
      if (tripId && view === "list") {
        const trip = trips.find(t => t.id === tripId);
        if (trip) openTrip(trip);
      }
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    async function firstLoad() {
      try {
        await Promise.all([loadMembers(), loadTrips()]);
        loadFailed = false;
      } catch {
        loadFailed = true;
      }
      render();
      if (!loadFailed) handleDeepLink(); // never open a detail over a failed load
    }
    document.addEventListener("click", (e) => {
      if (e.target.closest('[data-testid="load-retry"]')) firstLoad();
    });
    firstLoad();
  </script>
</body>
</html>
